<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">课</div><div><h1>课时账本</h1><span>课程 · 考勤 · 课酬</span></div></div>
    <div class="tool-group">
      <label class="month-picker">统计月份 <input type="month" id="monthInput"></label>
      <label class="month-picker">统计周期 <select id="periodMode"><option value="month">整月</option><option value="first">上半月 1—15</option><option value="second">下半月 16—月底</option><option value="payroll">15号发薪：上月16—本月15</option><option value="custom">自选起止日期</option></select></label>
      <div id="customPeriod" class="select-row" hidden><label class="month-picker">开始 <input id="customStart" type="date"></label><label class="month-picker">结束 <input id="customEnd" type="date"></label></div>
    </div>
  </header>
  <main id="main" aria-live="polite"></main>
</div>
<nav class="nav" aria-label="主导航">
  <button type="button" data-tab="home" class="active"><span class="ico">⌂</span>总览</button>
  <button type="button" data-tab="students"><span class="ico">👥</span>学员</button>
  <button type="button" data-tab="groups"><span class="ico">▦</span>班级</button>
  <button type="button" data-tab="pay"><span class="ico">¥</span>课酬</button>
  <button type="button" data-tab="settings"><span class="ico">⚙</span>数据</button>
</nav>
<dialog id="studentDialog"><div class="dialog-body">
  <div class="dialog-head"><div><h3 id="studentDialogTitle">新增学员</h3><p>报名节数和单独授课标准</p></div><button class="close" type="button" data-close="studentDialog">×</button></div>
  <form id="studentForm"><input id="studentId" type="hidden">
    <div class="field"><label>姓名 *</label><input id="studentName" maxlength="60" required placeholder="学员姓名"></div>
    <div class="form-row"><div class="field"><label>本学期报名节数</label><input id="studentPurchased" type="number" min="0" max="100000" step="1" value="30"></div><div class="field"><label>默认上课时间</label><input id="studentTime" type="time" value="10:00"></div></div>
    <div class="form-row"><div class="field"><label>单节时长（分钟）</label><input id="studentMinutes" type="number" min="10" max="1440" step="5" value="60"></div><div class="field"><label>单独授课计薪</label><select id="studentPayMode"><option value="perSession">按节</option><option value="hourly">按小时</option></select></div></div>
    <div class="field"><label>单独授课单价（元）</label><input id="studentRate" type="number" min="0" max="999999" step="0.01" value="0"><div class="field-note">加入班级后，匹配班级时间的考勤按班级计薪，不按人数重复计算。</div></div>
    <div class="field"><label>备注</label><textarea id="studentNotes" maxlength="500"></textarea></div>
    <div class="dialog-footer"><button type="button" class="btn" data-close="studentDialog">取消</button><button class="btn primary" type="submit">保存</button></div>
  </form></div></dialog>
<dialog id="groupDialog"><div class="dialog-body">
  <div class="dialog-head"><div><h3 id="groupDialogTitle">新建班级</h3><p>同一班次按日期和开始时间合并</p></div><button class="close" type="button" data-close="groupDialog">×</button></div>
  <form id="groupForm"><input id="groupId" type="hidden"><div class="field"><label>班级名称 *</label><input id="groupName" maxlength="60" required placeholder="周六下午班"></div>
    <div class="form-row"><div class="field"><label>上课时间 *</label><input type="time" id="groupTime" required value="14:00"></div><div class="field"><label>每节时长（分钟）</label><input id="groupMinutes" type="number" min="10" max="1440" step="5" value="90" required></div></div>
    <div class="form-row"><div class="field"><label>教师课酬计算</label><select id="groupPayMode"><option value="perSession">按节</option><option value="hourly">按小时</option></select></div><div class="field"><label>单价（元）</label><input id="groupRate" type="number" min="0" max="999999" step="0.01" value="120" required></div></div>
    <div class="field"><span class="lab">班级成员</span><div id="groupMembers" class="checklist"></div></div>
    <div class="note-box">已打过个人考勤的学生，归班后会按“日期 + 上课时间”自动汇总。没有时间的旧记录需要先补时间。</div>
    <div class="dialog-footer"><button type="button" class="btn" data-close="groupDialog">取消</button><button class="btn primary" type="submit">保存班级</button></div>
  </form></div></dialog>
<dialog id="attendanceDialog"><div class="dialog-body">
  <div class="dialog-head"><div><h3 id="attendanceTitle">学员考勤</h3><p id="attendanceSub">按日期勾选，填写上课时间</p></div><button class="close" type="button" data-close="attendanceDialog">×</button></div>
  <div class="form-row"><div class="field"><label>上课时间</label><select id="attendanceSlot"></select><input id="attendanceCustomTime" aria-label="自定义上课时间" type="time" value="10:00" hidden style="margin-top:6px"></div><div class="field"><label>本节时长（分钟）</label><input type="number" id="attendanceMinutes" step="5" min="10" max="1440"></div></div>
  <div id="attendanceHint" class="note-box"></div>
  <div id="attendanceGrid" class="date-grid"></div>
  <div class="subttl">本学期考勤明细</div><div id="attendanceRows" class="stack" style="max-height:28vh;overflow:auto"></div>
  <div class="dialog-footer"><button type="button" class="btn" data-close="attendanceDialog">完成</button></div>
</div></dialog>
<dialog id="groupDetailDialog"><div class="dialog-body">
  <div class="dialog-head"><div><h3 id="groupDetailTitle">班级考勤</h3><p id="groupDetailSub">按个人考勤自动汇总</p></div><button class="close" type="button" data-close="groupDetailDialog">×</button></div>
  <div id="groupDetailContent"></div>
  <div class="dialog-footer"><button type="button" class="btn" data-close="groupDetailDialog">完成</button></div>
</div></dialog>
<dialog id="leaveDialog"><div class="dialog-body">
  <div class="dialog-head"><div><h3>请假标记</h3><p id="leaveTitle"></p></div><button class="close" type="button" data-close="leaveDialog">×</button></div>
  <input type="hidden" id="leaveGroup"><input type="hidden" id="leaveDate"><input type="hidden" id="leaveTime"><input type="hidden" id="leaveStudent">
  <div class="field"><label>状态</label><select id="leaveStatus"><option value="leave">请假</option><option value="none">取消请假标记</option></select></div>
  <div class="field"><label>备注（选填）</label><textarea id="leaveNote" maxlength="100"></textarea></div>
  <div class="dialog-footer"><button type="button" class="btn" data-close="leaveDialog">取消</button><button type="button" class="btn primary" id="leaveSave">保存</button></div>
</div></dialog>
<input id="importFile" type="file" accept=".json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const VERSION=8,KEY='teacher-ledger-v8-local';
const PREVIOUS=['teacher-ledger-v7-local','teacher-ledger-v6-local','teacher-ledger-v5-local','teacher-ledger-v4-local','teacher-ledger-v3-local','teacher-ledger-v2-local','teacher-ledger-v1-local'];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
const pad=x=>String(x).padStart(2,'0');
const dayString=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dayString(new Date());
const thisMonth=()=>today().slice(0,7);
const money=v=>'¥'+Number(v||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const numeric=v=>Number(v||0).toLocaleString('zh-CN',{maximumFractionDigits:2});
const validDay=s=>{if(!/^\d{4}-(0[1-9]|1[0-2])-([0-2]\d|3[01])$/.test(String(s)))return false;let d=new Date(s+'T12:00:00');return !isNaN(d)&&dayString(d)===s;};
const validClock=s=>/^([01]\d|2[0-3]):[0-5]\d$/.test(s||'');
const within=(n,min,max,fallback)=>Number.isFinite(Number(n))&&Number(n)>=min&&Number(n)<=max?Number(n):fallback;
const minuteValue=(x,fallback=60)=>Math.round(within(x,10,1440,fallback));
const rateValue=(x,fallback=0)=>within(x,0,999999,fallback);
const fee=(minutes,rate,mode)=>Math.round((mode==='hourly'?minutes*rate/60:rate)*100)/100;
const humanDay=s=>`${Number(s.slice(5,7))}月${Number(s.slice(8,10))}日`;
const wd=s=>['周日','周一','周二','周三','周四','周五','周六'][new Date(s+'T12:00:00').getDay()];
const nowIso=()=>new Date().toISOString();
const semesterDefault=()=>{const now=new Date(),y=now.getFullYear(),m=now.getMonth()+1;if(m>=9)return {start:y+'-09-01',end:(y+1)+'-01-31'};if(m===1)return {start:(y-1)+'-09-01',end:y+'-01-31'};return {start:y+'-02-01',end:y+'-08-31'};};
const blank=()=>({version:VERSION,students:[],groups:[],attendance:[],legacyLessons:[],settlements:{},paySnapshots:{},leaves:[],semester:semesterDefault()});
function validateCurrent(s){
  if(Number(s?.version||0)>VERSION)throw Error('备份来自更新版本，不能用旧版覆盖');
  if(!s||!Array.isArray(s.students)||!Array.isArray(s.groups)||!Array.isArray(s.attendance)||!Array.isArray(s.legacyLessons)||!Array.isArray(s.leaves))throw Error('备份数据结构不完整');
  if(s.students.length>50000||s.groups.length>20000||s.attendance.length>500000||s.legacyLessons.length>300000||s.leaves.length>300000)throw Error('备份文件记录过多');
  const students=s.students.map(x=>({id:String(x.id).slice(0,128),name:String(x.name).trim().slice(0,60),purchasedLessons:Math.floor(within(x.purchasedLessons,0,100000,0)),startTime:validClock(x.startTime)?x.startTime:'10:00',minutes:minuteValue(x.minutes),rate:rateValue(x.rate),payMode:x.payMode==='hourly'?'hourly':'perSession',notes:String(x.notes||'').slice(0,500)}));
  if(students.some(x=>!x.id||!x.name)||new Set(students.map(x=>x.id)).size!==students.length)throw Error('学员 ID 或姓名有误');
  const studentIds=new Set(students.map(x=>x.id));
  const groups=s.groups.map(x=>({id:String(x.id).slice(0,128),name:String(x.name).trim().slice(0,60),studentIds:[...new Set((x.studentIds||[]).filter(id=>studentIds.has(id)))],startTime:validClock(x.startTime)?x.startTime:'',minutes:minuteValue(x.minutes,90),rate:rateValue(x.rate),payMode:x.payMode==='hourly'?'hourly':'perSession',archived:!!x.archived}));
  if(groups.some(x=>!x.id||!x.name)||new Set(groups.map(x=>x.id)).size!==groups.length)throw Error('班级 ID 或名称有误');
  const groupIds=new Set(groups.map(x=>x.id));
  const attendance=s.attendance.map(x=>({id:String(x.id).slice(0,128),studentId:String(x.studentId),date:String(x.date),startTime:validClock(x.startTime)?x.startTime:'',minutes:minuteValue(x.minutes),groupId:groupIds.has(x.groupId)?x.groupId:'',legacySessionId:String(x.legacySessionId||'').slice(0,128),createdAt:String(x.createdAt||'')}));
  if(attendance.some(x=>!x.id||!studentIds.has(x.studentId)||!validDay(x.date))||new Set(attendance.map(x=>x.id)).size!==attendance.length)throw Error('个人考勤存在无效日期或学员');
  const legacyLessons=s.legacyLessons.map(x=>({id:String(x.id).slice(0,128),date:String(x.date),startTime:validClock(x.startTime)?x.startTime:'',title:String(x.title||'原课程').slice(0,80),minutes:minuteValue(x.minutes),rate:rateValue(x.rate),payMode:x.payMode==='hourly'?'hourly':'perSession',studentIds:[...new Set((x.studentIds||[]).filter(id=>studentIds.has(id)))],groupId:groupIds.has(x.groupId)?x.groupId:'',source:['student','group','manual'].includes(x.source)?x.source:'manual',settled:!!x.settled,notes:String(x.notes||'').slice(0,500)}));
  if(legacyLessons.some(x=>!x.id||!validDay(x.date))||new Set(legacyLessons.map(x=>x.id)).size!==legacyLessons.length)throw Error('旧课程数据有误');
  const leaves=s.leaves.map(x=>({id:String(x.id),studentId:String(x.studentId),groupId:String(x.groupId),date:String(x.date),startTime:validClock(x.startTime)?x.startTime:'',note:String(x.note||'').slice(0,100)}));
  if(leaves.some(x=>!x.id||!validDay(x.date)||!studentIds.has(x.studentId)||!groupIds.has(x.groupId)))throw Error('请假记录有误');
  const settlements={};if(s.settlements&&typeof s.settlements==='object'){for(const [k,v] of Object.entries(s.settlements).slice(0,600000))if(k.length<=300)settlements[k]=!!v;}
  const paySnapshots={};if(s.paySnapshots&&typeof s.paySnapshots==='object'){for(const [k,v] of Object.entries(s.paySnapshots).slice(0,600000)){if(k.length>300||!v||typeof v!=='object')continue;paySnapshots[k]={minutes:minuteValue(v.minutes),rate:rateValue(v.rate),payMode:v.payMode==='hourly'?'hourly':'perSession'};}}
  const sem=s.semester||semesterDefault();const semester=validDay(sem.start)&&validDay(sem.end)&&sem.start<=sem.end?{start:sem.start,end:sem.end}:semesterDefault();
  return {version:VERSION,students,groups,attendance,legacyLessons,settlements,paySnapshots,leaves,semester};
}
// V1-V7 课程记录保留为历史课酬。历史个人考勤不凭空猜测上午/下午。
function migrateLegacy(old){
  const s=blank(),d=semesterDefault();s.semester=d;
  if(!old||!Array.isArray(old.students)||!Array.isArray(old.sessions))throw Error('旧数据格式不正确');
  for(const x of old.students){if(!x||!x.id||!x.name)continue;s.students.push({id:String(x.id),name:String(x.name),purchasedLessons:Math.floor(within(x.purchasedLessons,0,100000,0)),startTime:'10:00',minutes:Math.round(within(x.duration,0.25,24,1)*60),rate:rateValue(x.rate),payMode:x.payMode==='hourly'?'hourly':'perSession',notes:String(x.notes||'')});}
  const studentIds=new Set(s.students.map(x=>x.id));
  for(const g of old.groups||[]){if(!g||!g.id||!g.name)continue;s.groups.push({id:String(g.id),name:String(g.name),studentIds:[...new Set((g.studentIds||[]).filter(x=>studentIds.has(x)))],startTime:'',minutes:Math.round(within(g.duration,0.25,24,1)*60),rate:rateValue(g.rate),payMode:g.payMode==='hourly'?'hourly':'perSession',archived:false});}
  const groups=new Set(s.groups.map(g=>g.id));
  for(const x of old.sessions){if(!x||!validDay(x.date)||!x.id)continue;const sid=String(x.id),valid=(x.studentIds||[]).filter(id=>studentIds.has(id));s.legacyLessons.push({id:sid,date:x.date,startTime:'',title:String(x.title||'原课程'),minutes:Math.round(within(x.duration,0.25,24,1)*60),rate:rateValue(x.rate),payMode:x.payMode==='hourly'?'hourly':'perSession',studentIds:[...new Set(valid)],groupId:groups.has(x.groupId)?x.groupId:'',source:x.source||'manual',settled:!!x.settled,notes:String(x.notes||'')});
    for(const id of new Set(valid))s.attendance.push({id:'legacy-att-'+sid+'-'+id,studentId:id,date:x.date,startTime:'',minutes:Math.round(within(x.duration,0.25,24,1)*60),groupId:groups.has(x.groupId)?x.groupId:'',legacySessionId:sid,createdAt:x.createdAt||''});
  }
  for(const c of old.checkins||[]){if(!c||!c.id||!studentIds.has(c.studentId)||!validDay(c.date)||c.linkedSessionId)continue;s.attendance.push({id:String(c.id),studentId:c.studentId,date:c.date,startTime:'',minutes:60,groupId:groups.has(c.groupId)?c.groupId:'',legacySessionId:'',createdAt:c.createdAt||''});}
  return validateCurrent(s);
}
let storageUsable=true;
function loadData(){for(const k of [KEY,...PREVIOUS]){try{const raw=localStorage.getItem(k);if(!raw)continue;const p=JSON.parse(raw);return Number(p.version||1)===8?validateCurrent(p):migrateLegacy(p);}catch(e){console.warn('读取本地数据失败',k,e);if(k===KEY){storageUsable=false;break;}}}return blank();}
let data=loadData(),tab='home',selectedMonth=thisMonth(),periodMode='month';
let customStart=thisMonth()+'-01',customEnd=today(),currentStudent='',currentGroup='',currentSlotKey='';
let toastTimer;
function persist(){try{freezePaySnapshots();localStorage.setItem(KEY,JSON.stringify(data));storageUsable=true;return true;}catch(e){storageUsable=false;alert('本机保存失败，请导出备份。');return false;}}
if(storageUsable)persist();
function toast(t){let el=$('toast');if(!el)return;el.textContent=t;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.style.display='none';},3000);}
function range(){const [y,m]=selectedMonth.split('-').map(Number),last=`${selectedMonth}-${pad(new Date(y,m,0).getDate())}`;
 if(periodMode==='custom'&&validDay(customStart)&&validDay(customEnd)&&customStart<=customEnd)return {start:customStart,end:customEnd,label:'自选日期'};
 if(periodMode==='first')return {start:selectedMonth+'-01',end:selectedMonth+'-15',label:'上半月'};
 if(periodMode==='second')return {start:selectedMonth+'-16',end:last,label:'下半月'};
 if(periodMode==='payroll')return {start:dayString(new Date(y,m-2,16)),end:selectedMonth+'-15',label:'15号发薪周期'};
 return {start:selectedMonth+'-01',end:last,label:'整月'};
}
function rangeLabel(){const p=range();return `${p.start} — ${p.end}（${p.label}）`;}
function inside(date,r=range()){return date>=r.start&&date<=r.end;}
function calendarDays(){const r=range(),a=[];if(!validDay(r.start)||!validDay(r.end))return a;const start=new Date(r.start+'T12:00:00'),end=new Date(r.end+'T12:00:00');for(let d=start;d<=end&&a.length<124;d.setDate(d.getDate()+1))a.push(dayString(d));return a;}
function studentBy(id){return data.students.find(s=>s.id===id);}
function groupBy(id){return data.groups.find(g=>g.id===id);}
function semesterLessons(sid){return data.attendance.filter(a=>a.studentId===sid&&inside(a.date,data.semester)).length;}
function periodLessons(sid){return data.attendance.filter(a=>a.studentId===sid&&inside(a.date)).length;}
function studentsIn(g){return g.studentIds.map(studentBy).filter(Boolean);}
function resolveGroup(a){
  if(a.groupId){const g=groupBy(a.groupId);if(g&&g.studentIds.includes(a.studentId)&&(!a.startTime||validClock(a.startTime)))return g;}
  if(!a.startTime)return null;
  const candidate=data.groups.filter(g=>g.studentIds.includes(a.studentId)&&g.startTime===a.startTime);
  return candidate.length===1?candidate[0]:null;
}
function effectiveTime(a,g){return a.startTime||(a.groupId===g?.id?g.startTime:'');}
function slotId(gid,date,time){return gid+'|'+date+'|'+time;}
function attendeesFor(gid,date,time){return data.attendance.filter(a=>{const g=resolveGroup(a);return g?.id===gid&&a.date===date&&effectiveTime(a,g)===time;});}
function hasLegacyGroupCover(gid,date,time,attendees){return data.legacyLessons.some(x=>x.date===date&&(x.groupId===gid||(!x.groupId&&x.studentIds.some(id=>attendees.some(a=>a.studentId===id))))&&(!x.startTime||x.startTime===time));}
function groupEvents(){
  const map=new Map();
  for(const a of data.attendance){const g=resolveGroup(a);if(!g)continue;const time=effectiveTime(a,g);if(!time)continue;const k=slotId(g.id,a.date,time);if(!map.has(k))map.set(k,{key:k,group:g,date:a.date,time,attendance:[]});map.get(k).attendance.push(a);}
  return [...map.values()].sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time));
}
function freezePaySnapshots(){
 for(const e of groupEvents()){
  const k='group|'+e.key;if(hasLegacyGroupCover(e.group.id,e.date,e.time,e.attendance))continue;
  if(!data.paySnapshots[k])data.paySnapshots[k]={minutes:e.group.minutes,rate:e.group.rate,payMode:e.group.payMode};
 }
 for(const a of data.attendance){if(resolveGroup(a)||a.legacySessionId)continue;const st=studentBy(a.studentId),k='solo|'+a.id;
  if(st&&!data.paySnapshots[k])data.paySnapshots[k]={minutes:a.minutes,rate:st.rate,payMode:st.payMode};
 }
}
function teacherLessons(){
 const out=data.legacyLessons.map(x=>({key:'legacy|'+x.id,legacyId:x.id,date:x.date,time:x.startTime,title:x.title,minutes:x.minutes,rate:x.rate,payMode:x.payMode,amount:fee(x.minutes,x.rate,x.payMode),settled:x.settled,source:'legacy',studentIds:x.studentIds}));
 for(const e of groupEvents()){
   if(hasLegacyGroupCover(e.group.id,e.date,e.time,e.attendance))continue;
   const k='group|'+e.key,g=e.group;
   const cfg=data.paySnapshots[k]||{minutes:g.minutes,rate:g.rate,payMode:g.payMode};
   out.push({key:k,date:e.date,time:e.time,title:g.name,minutes:cfg.minutes,rate:cfg.rate,payMode:cfg.payMode,amount:fee(cfg.minutes,cfg.rate,cfg.payMode),settled:!!data.settlements[k],source:'group',groupId:g.id,studentIds:[...new Set(e.attendance.map(a=>a.studentId))]});
 }
 for(const a of data.attendance){if(resolveGroup(a)||a.legacySessionId)continue;const s=studentBy(a.studentId);if(!s)continue;const k='solo|'+a.id;
   const cfg=data.paySnapshots[k]||{minutes:a.minutes,rate:s.rate,payMode:s.payMode};
   out.push({key:k,date:a.date,time:a.startTime,title:s.name+' · 单独授课',minutes:cfg.minutes,rate:cfg.rate,payMode:cfg.payMode,amount:fee(cfg.minutes,cfg.rate,cfg.payMode),settled:!!data.settlements[k],source:'solo',studentIds:[s.id]});
 }
 return out.sort((a,b)=>b.date.localeCompare(a.date)||(b.time||'').localeCompare(a.time||''));
}
function periodTeachers(){return teacherLessons().filter(x=>inside(x.date));}
function totalPay(list){return {count:list.length,minutes:list.reduce((n,x)=>n+x.minutes,0),amount:list.reduce((n,x)=>n+x.amount,0),settled:list.filter(x=>x.settled).reduce((n,x)=>n+x.amount,0),pending:list.filter(x=>!x.settled).reduce((n,x)=>n+x.amount,0)};}
function timeLabel(v){return v||'时间未设置';}
function groupStatus(group,date,time,sid){if(attendeesFor(group.id,date,time).some(a=>a.studentId===sid))return 'present';return data.leaves.some(l=>l.groupId===group.id&&l.date===date&&l.startTime===time&&l.studentId===sid)?'leave':'none';}
function groupStats(g){const events=groupEvents().filter(x=>x.group.id===g.id&&inside(x.date));return {sessions:events.length,arrivals:events.reduce((n,e)=>n+new Set(e.attendance.map(a=>a.studentId)).size,0),leaves:events.reduce((n,e)=>n+g.studentIds.filter(id=>groupStatus(g,e.date,e.time,id)==='leave').length,0)};}
function stat(k,v,d='',main=false){return `<div class="stat ${main?'emph':''}"><div class="k">${esc(k)}</div><strong class="number">${esc(v)}</strong><div class="d">${esc(d)}</div></div>`;}

 const g=spec.groupId?groupBy(spec.groupId):null;
 $('attendanceHint').innerHTML=`当前：${g?esc(g.name):'个人考勤'} · ${esc(spec.startTime||'未设时间')} · ${spec.minutes} 分钟。点击日期直接勾选/取消。${g?'同一班级同一时间自动合并为教师一节课。':''}`;
 $('attendanceGrid').innerHTML=days.map(d=>{const matching=data.attendance.filter(a=>a.studentId===s.id&&a.date===d&&attendanceMatchesSlot(a,spec));const all=data.attendance.filter(a=>a.studentId===s.id&&a.date===d);return `<label class="date-day ${matching.length?'active':''}"><input type="checkbox" data-check-date="${esc(d)}" ${matching.length?'checked':''}><span><span class="date-label">${esc(humanDay(d))} ${wd(d)}</span><span class="date-sub">${matching.length?'已上 1 节':all.length?`其他时段 ${all.length} 节`:'未记录'}</span></span></label>`;}).join('');
 const records=data.attendance.filter(a=>a.studentId===s.id&&inside(a.date,data.semester)).sort((a,b)=>b.date.localeCompare(a.date)||(b.startTime||'').localeCompare(a.startTime||''));
 $('attendanceRows').innerHTML=records.length?records.map(a=>{const gg=resolveGroup(a);return `<div class="rowcard"><div class="row-flex"><div class="main"><strong>${esc(a.date)} ${esc(timeLabel(a.startTime||(gg?.startTime||'')))}</strong><div class="meta">${a.minutes} 分钟 · ${gg?esc(gg.name):'单独考勤'}${a.legacySessionId?' · 旧课程记录':''}</div></div><div class="row-actions"><button class="btn small subtle" data-action="fix-time" data-id="${esc(a.id)}">${a.startTime?'改时间':'补时间'}</button><button class="btn small danger" data-action="delete-attendance" data-id="${esc(a.id)}">删除</button></div></div></div>`;}).join(''):'<div class="small-empty">本学期暂无考勤。</div>';
}
function setAttendanceDay(date,on){const s=studentBy(currentStudent),spec=currentSlot();if(!s||!validDay(date)||!validClock(spec.startTime)||spec.minutes<10||spec.minutes>1440)return toast('请确认日期、时间和分钟数');
 const matching=data.attendance.filter(a=>a.studentId===s.id&&a.date===date&&attendanceMatchesSlot(a,spec));
 if(on){if(matching.length)return;const duplicate=data.attendance.some(a=>a.studentId===s.id&&a.date===date&&a.startTime===spec.startTime);if(duplicate)return toast('这个日期和时间已记录过课，请检查其它班次');
 data.attendance.push({id:uid(),studentId:s.id,date,startTime:spec.startTime,minutes:spec.minutes,groupId:spec.groupId,legacySessionId:'',createdAt:nowIso()});
 }else{if(!matching.length)return;const toDelete=matching[0];if(toDelete.legacySessionId&&!confirm('这是从旧课程导入的考勤，删除后旧课程课酬仍保留。确定删除此考勤吗？')){updateAttendanceView();return;}
 if(!canRemoveAttendance(toDelete)){updateAttendanceView();return;}data.attendance=data.attendance.filter(a=>a.id!==toDelete.id);delete data.settlements['solo|'+toDelete.id];}
 persist();updateAttendanceView();render();}
function canRemoveAttendance(a){const g=resolveGroup(a);if(!g){if(data.settlements['solo|'+a.id]){toast('这节课已结算，请先取消结算');return false;}return true;}
 const all=attendeesFor(g.id,a.date,effectiveTime(a,g));if(all.length===1&&data.settlements['group|'+slotId(g.id,a.date,effectiveTime(a,g))]){toast('班课已结算，请先取消结算');return false;}return true;}
function deleteAttendance(id){const a=data.attendance.find(x=>x.id===id);if(!a)return;if(!confirm('确定删除该条个人考勤？'))return;if(!canRemoveAttendance(a))return;
 if(a.legacySessionId)toast('旧课程课酬记录仍保留，请核对');data.attendance=data.attendance.filter(x=>x.id!==id);delete data.settlements['solo|'+id];persist();updateAttendanceView();render();}
function fixTime(id){const a=data.attendance.find(x=>x.id===id);if(!a)return;const spec=currentSlot();if(!validClock(spec.startTime))return toast('请先选一个有效的时间');if(data.attendance.some(x=>x.id!==a.id&&x.studentId===a.studentId&&x.date===a.date&&x.startTime===spec.startTime)){toast('同一日期和时间已经有考勤');return;}
 const oldGroup=resolveGroup(a);if(oldGroup&&data.settlements['group|'+slotId(oldGroup.id,a.date,effectiveTime(a,oldGroup))])return toast('这节课已经结算，请先取消结算');
 a.startTime=spec.startTime;a.groupId=spec.groupId;a.minutes=spec.minutes;persist();updateAttendanceView();render();toast('已补充开课时间');}
function openGroupDetail(id){const g=groupBy(id);if(!g)return;currentGroup=id;$('groupDetailTitle').textContent=g.name+' · 班级考勤';$('groupDetailSub').textContent=`${g.startTime||'未设置时间'} · ${g.minutes} 分钟 · ${rangeLabel()}`;refreshGroupDetail();openDialog('groupDetailDialog');}
function refreshGroupDetail(){const g=groupBy(currentGroup);if(!g)return;const events=groupEvents().filter(x=>x.group.id===g.id&&inside(x.date));const missing=data.attendance.filter(a=>g.studentIds.includes(a.studentId)&&!a.startTime&&inside(a.date)&&(!a.groupId||a.groupId===g.id));const st=groupStats(g);
 $('groupDetailContent').innerHTML=`<div class="sum-grid"><div class="sum-block">开课次数<strong>${st.sessions}</strong></div><div class="sum-block">到课人次<strong>${st.arrivals}</strong></div><div class="sum-block">标记请假<strong>${st.leaves}</strong></div></div>
 ${missing.length&&g.startTime?`<div class="note-box" style="margin-top:12px">有 ${missing.length} 条旧考勤缺少时间。<button type="button" class="btn small subtle" data-action="backfill-time" data-id="${esc(g.id)}">补齐为 ${g.startTime}</button></div>`:''}${g.startTime?`<div class="split-actions" style="margin:12px 0"><button type="button" class="btn small" data-action="link-existing" data-id="${esc(g.id)}">将本期个人记录归入本班时间</button></div>`:''}
 <div class="subttl">本期各次班课</div>
 ${events.length?events.map(e=>groupEventCard(e)).join(''):'<div class="small-empty">暂无匹配的班级考勤。先在学员的个人考勤里填写日期和班级时间。</div>'}`;}
function groupEventCard(e){const g=e.group,present=[...new Set(e.attendance.map(a=>a.studentId))],leaveIds=g.studentIds.filter(id=>groupStatus(g,e.date,e.time,id)==='leave'),notMarked=g.studentIds.filter(id=>!present.includes(id)&&!leaveIds.includes(id));
 const p=teacherLessons().find(l=>l.source==='group'&&l.groupId===g.id&&l.date===e.date&&l.time===e.time);const legacyCovered=hasLegacyGroupCover(g.id,e.date,e.time,e.attendance);
 return `<div class="rowcard" style="margin-bottom:10px"><div class="row-flex"><div class="main"><strong>${esc(e.date)} ${wd(e.date)} · ${esc(e.time)}</strong><div class="meta">到课 ${present.length} / ${g.studentIds.length} · 请假 ${leaveIds.length} · 未打卡 ${notMarked.length} · 授课 ${g.minutes} 分钟</div></div><span class="pill ${p?.settled?'done':''}">${legacyCovered?'旧课酬已保留':p?money(p.amount):'未单独计薪'}</span></div>
 <table class="attendance-table"><thead><tr><th>学员</th><th>状态</th><th>处理</th></tr></thead><tbody>${studentsIn(g).map(s=>{const status=groupStatus(g,e.date,e.time,s.id);return `<tr><td>${esc(s.name)}</td><td class="${status==='present'?'status-present':status==='leave'?'status-leave':'status-none'}">${status==='present'?'✓ 到课':status==='leave'?'请假':'未打卡'}</td><td>${status==='present'?'—':`<button class="no-outline" data-action="mark-leave" data-group="${esc(g.id)}" data-id="${esc(s.id)}" data-date="${e.date}" data-time="${e.time}">${status==='leave'?'修改':'标记请假'}</button>`}</td></tr>`;}).join('')}</tbody></table></div>`;}
function backfillTimes(id){const g=groupBy(id);if(!g||!validClock(g.startTime))return toast('先给班级设置开始时间');const r=range();const candidates=data.attendance.filter(a=>!a.startTime&&inside(a.date,r)&&g.studentIds.includes(a.studentId)&&(!a.groupId||a.groupId===g.id)&&!data.groups.some(gg=>gg.id!==g.id&&gg.studentIds.includes(a.studentId)&&gg.startTime===g.startTime));
 const byKey=new Map();for(const a of candidates){const k=a.studentId+'|'+a.date;byKey.set(k,(byKey.get(k)||0)+1);}
 const eligible=candidates.filter(a=>byKey.get(a.studentId+'|'+a.date)===1&&!data.attendance.some(b=>b.id!==a.id&&b.studentId===a.studentId&&b.date===a.date&&b.startTime===g.startTime));
 if(!eligible.length)return toast('本期无可安全归班的无时间考勤');
 if(!confirm(`将本期 ${eligible.length} 条没有上课时间的旧个人考勤设置为 ${g.startTime}，并归入「${g.name}」？\n\n这只是补时间，不会新增学生节数。旧课程的工资记录会保留，请核对。`))return;
 for(const a of eligible){a.startTime=g.startTime;a.groupId=g.id;}persist();refreshGroupDetail();render();toast('已归班 '+eligible.length+' 条考勤');}
function linkExisting(id){
 const g=groupBy(id);if(!g||!validClock(g.startTime))return toast('请先设置班级时间');
 const r=range(),inRange=data.attendance.filter(a=>inside(a.date,r)&&g.studentIds.includes(a.studentId));
 const byStudentDate=new Map();for(const a of inRange){const k=a.studentId+'|'+a.date;byStudentDate.set(k,(byStudentDate.get(k)||0)+1);}
 const candidates=inRange.filter(a=>{
  if(a.legacySessionId||a.groupId&&a.groupId!==g.id||data.settlements['solo|'+a.id])return false;
  if(byStudentDate.get(a.studentId+'|'+a.date)!==1)return false; // 同一天多节不能猜
  const current=resolveGroup(a);if(current&&current.id!==g.id)return false;
  return a.startTime!==g.startTime||a.groupId!==g.id;
 });
 if(!candidates.length)return toast('本期没有可安全归班的个人考勤');
 if(!confirm(`准备把本期 ${candidates.length} 条个人考勤统一归入「${g.name}」${g.startTime}。\n将更改原先记录的时间，只有确认这些课程实际属于这个班才可以继续。\n历史已结算的旧课程和同一天多节的记录会跳过。`))return;
 for(const a of candidates){a.startTime=g.startTime;a.groupId=g.id;a.minutes=g.minutes;}
 persist();refreshGroupDetail();render();toast(`已归班 ${candidates.length} 条考勤`);
}
function openLeave(btn){const g=groupBy(btn.dataset.group),s=studentBy(btn.dataset.id);if(!g||!s)return;$('leaveGroup').value=g.id;$('leaveStudent').value=s.id;$('leaveDate').value=btn.dataset.date;$('leaveTime').value=btn.dataset.time;
 const old=data.leaves.find(l=>l.groupId===g.id&&l.studentId===s.id&&l.date===btn.dataset.date&&l.startTime===btn.dataset.time);$('leaveTitle').textContent=`${s.name} · ${btn.dataset.date} ${btn.dataset.time}`;$('leaveStatus').value=old?'leave':'leave';$('leaveNote').value=old?.note||'';openDialog('leaveDialog');}
function saveLeave(){const groupId=$('leaveGroup').value,studentId=$('leaveStudent').value,date=$('leaveDate').value,time=$('leaveTime').value;
 data.leaves=data.leaves.filter(l=>!(l.groupId===groupId&&l.studentId===studentId&&l.date===date&&l.startTime===time));
 if($('leaveStatus').value==='leave')data.leaves.push({id:uid(),groupId,studentId,date,startTime:time,note:$('leaveNote').value.trim().slice(0,100)});
 persist();closeDialog('leaveDialog');refreshGroupDetail();render();toast('请假状态已更新');}
function toggleSettle(key){const p=teacherLessons().find(l=>l.key===key);if(!p)return;if(p.source==='legacy'){const x=data.legacyLessons.find(l=>l.id===p.legacyId);if(x)x.settled=!x.settled;}else data.settlements[key]=!p.settled;
 persist();render();toast('结算状态已更新');}
function settleAll(){const list=periodTeachers().filter(l=>!l.settled);if(!list.length)return toast('本期没有待结算课程');if(!confirm(`确认将本期 ${list.length} 节课程的课酬全部标记为已结算？`))return;
 for(const l of list){if(l.source==='legacy'){const x=data.legacyLessons.find(x=>x.id===l.legacyId);if(x)x.settled=true;}else data.settlements[l.key]=true;}persist();render();toast('本期已结算');}
function csvCell(x){let v=String(x??'');if(/^[\s]*[=+@\-]/.test(v)&&!Number.isFinite(Number(v)))v="'"+v;return '"'+v.replaceAll('"','""')+'"';}
function csv(rows){return '\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';}
function download(text,name,mime='text/csv;charset=utf-8'){const u=URL.createObjectURL(new Blob([text],{type:mime}));let a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);toast('已开始下载 '+name);}
function backup(){download(JSON.stringify({app:'TeacherLedger',version:VERSION,exportedAt:nowIso(),data},null,2),'课时账本_V8完整备份_'+today()+'.json','application/json;charset=utf-8');}
function exportStudents(){const r=[['学员','报名总节数','本学期已上节数','本学期剩余节数','学期开始','学期结束','本期上课节数','所在班级']];data.students.forEach(s=>r.push([s.name,s.purchasedLessons,semesterLessons(s.id),s.purchasedLessons? s.purchasedLessons-semesterLessons(s.id):'未设置',data.semester.start,data.semester.end,periodLessons(s.id),data.groups.filter(g=>g.studentIds.includes(s.id)).map(g=>g.name).join('、')]));download(csv(r),'学员学期课时_'+today()+'.csv');}
function exportAttendance(){const r=[['日期','开课时间','时长(分钟)','学员','班级','历史课程关联','统计期间']];data.attendance.filter(a=>inside(a.date)).forEach(a=>r.push([a.date,a.startTime||'未设置',a.minutes,studentBy(a.studentId)?.name||'',resolveGroup(a)?.name||'单独授课',a.legacySessionId?'是':'否',rangeLabel()]));download(csv(r),'个人考勤_'+selectedMonth+'.csv');}
function exportGroups(){const r=[['班级','日期','开课时间','上课时长(分钟)','学员','考勤状态','实际教师开课','统计期间']];for(const e of groupEvents().filter(e=>inside(e.date))){for(const id of e.group.studentIds){const status=groupStatus(e.group,e.date,e.time,id);r.push([e.group.name,e.date,e.time,e.group.minutes,studentBy(id)?.name||'',status==='present'?'到课':status==='leave'?'请假':'未打卡',1,rangeLabel()]);}}download(csv(r),'班级考勤_'+selectedMonth+'.csv');}
function exportPay(){const r=[['日期','时间','课程/班级','时长(分钟)','计薪方式','课酬(元)','结算状态','统计期间']];periodTeachers().forEach(x=>r.push([x.date,x.time||'未设置',x.title,x.minutes,x.payMode==='hourly'?'按小时':'按节',x.amount,x.settled?'已结算':'未结算',rangeLabel()]));download(csv(r),'教师课酬_'+selectedMonth+'.csv');}
function saveSemester(){const a=$('semesterStart').value,b=$('semesterEnd').value;if(!validDay(a)||!validDay(b)||a>b)return toast('学期日期不合法');data.semester={start:a,end:b};persist();render();toast('学期日期已更新');}

// DOM event delegation. 个人打卡是唯一原始来源；班级考勤与课酬均为计算结果。
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;render();window.scrollTo(0,0);return;}
 const close=e.target.closest('[data-close]');if(close){closeDialog(close.dataset.close);return;}
 const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action,id=btn.dataset.id;
 if(a==='add-student')openStudent();else if(a==='edit-student')openStudent(id);
 else if(a==='add-group')openGroup();else if(a==='edit-group')openGroup(id);
 else if(a==='attendance')openAttendance(id);else if(a==='group-detail')openGroupDetail(id);
 else if(a==='delete-attendance')deleteAttendance(id);else if(a==='fix-time')fixTime(id);
 else if(a==='backfill-time')backfillTimes(id);else if(a==='link-existing')linkExisting(id);else if(a==='mark-leave')openLeave(btn);
 else if(a==='toggle-settle')toggleSettle(btn.dataset.key);else if(a==='settle-all')settleAll();
 else if(a==='backup')backup();else if(a==='restore'){$('importFile').value='';$('importFile').click();}
 else if(a==='export-students')exportStudents();else if(a==='export-attendance')exportAttendance();else if(a==='export-groups')exportGroups();else if(a==='export-pay')exportPay();
 else if(a==='save-semester')saveSemester();
});
document.addEventListener('change',e=>{
 if(e.target.matches('[data-check-date]'))setAttendanceDay(e.target.dataset.checkDate,e.target.checked);
 if(e.target.id==='attendanceSlot')attendanceSlotChanged();
 if(e.target.id==='attendanceCustomTime')updateAttendanceView();
 if(e.target.id==='attendanceMinutes')updateAttendanceView();
});
$('studentForm').addEventListener('submit',saveStudent);$('groupForm').addEventListener('submit',saveGroup);
$('leaveSave').addEventListener('click',saveLeave);
$('monthInput').addEventListener('change',e=>{if(/^\d{4}-(0[1-9]|1[0-2])$/.test(e.target.value)){selectedMonth=e.target.value;render();}});
$('periodMode').addEventListener('change',e=>{periodMode=e.target.value;render();});
$('customStart').addEventListener('change',e=>{if(validDay(e.target.value)){customStart=e.target.value;render();}});
$('customEnd').addEventListener('change',e=>{if(validDay(e.target.value)){customEnd=e.target.value;render();}});
$('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;
 try{if(file.size>20*1024*1024)throw Error('文件超过 20MB');const raw=JSON.parse(await file.text()),p=raw.data||raw,next=Number(p.version||1)===8?validateCurrent(p):migrateLegacy(p);
 if(!confirm(`恢复后将覆盖现有全部记录（${next.students.length} 名学员、${next.attendance.length} 条个人考勤）。请先备份当前数据。\n确定继续？`))return;
 data=next;persist();tab='home';render();toast('备份恢复成功');}catch(err){alert('恢复失败：'+err.message);}finally{e.target.value='';}});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close();}));
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();

</script></body></html>
