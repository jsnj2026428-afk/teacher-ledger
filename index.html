.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.panel{background:#fff;border:1px solid var(--border);border-radius:17px;padding:18px;margin-bottom:15px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:15px}.panel-head h3{font-size:16px;letter-spacing:-.02em;margin:0}.panel-head .desc{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.5}.section-notice{font-size:12px;color:#5f6e82;background:#f0f4fa;border-radius:10px;padding:11px 12px;line-height:1.7;margin-bottom:14px}.section-notice.warn{color:#94672a;background:#fff7e9}
.student-list,.course-list{display:grid;gap:10px}.student-item{background:#fff;border:1px solid var(--border);border-radius:13px;padding:15px}.student-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.student-main{min-width:0;flex:1}.student-name{font-weight:750;font-size:15px;line-height:1.5;overflow-wrap:anywhere}.student-status{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.5}.student-status b{color:#354051;font-weight:750}.student-count{font-size:12px;color:var(--muted);margin-top:4px}.student-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}.quick{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:11px;font-size:14px;font-weight:750;min-height:43px;min-width:72px;padding:10px 12px;white-space:nowrap}.quick:active{transform:scale(.96)}.progress{height:6px;border-radius:9px;background:#edf1f5;overflow:hidden;margin:13px 0 0}.progress>div{height:100%;background:#5b85cd;border-radius:inherit}.student-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}.student-foot span{font-size:12px;color:var(--sub)}.tiny-actions{display:flex;align-items:center;gap:7px}
.pill{font-size:11px;font-weight:650;border-radius:100px;padding:4px 8px;white-space:nowrap}.pill.done{background:var(--green-soft);color:var(--green)}.pill.pending{background:var(--amber-soft);color:var(--amber)}.pill.low{background:#fff0ea;color:#9f4c38}
.course-item{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:13px 0;border-top:1px solid #eef0f4}.course-item:first-child{border-top:0;padding-top:0}.course-main{flex:1;min-width:0}.course-name{font-size:14px;font-weight:750}.course-meta{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6}.course-money{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:15px;font-weight:750}.course-side{display:flex;align-items:flex-end;flex-direction:column;gap:9px}.course-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}.muted{color:var(--muted)}.empty{padding:26px 10px 30px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8}.empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:7px}.empty .btn{margin-top:9px}.search{width:100%;min-height:42px;border:1px solid var(--border);border-radius:11px;padding:10px 12px;background:#fff;color:var(--ink);margin-bottom:14px}.search::placeholder{color:#a8afbc}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.settings-block{border-bottom:1px solid var(--border);padding:15px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.settings-block:first-child{padding-top:0}.settings-block:last-child{border-bottom:0;padding-bottom:0}.settings-block strong{font-size:14px}.settings-block p{font-size:12px;color:var(--sub);margin:5px 0 0;line-height:1.6}.settings-actions{display:flex;gap:8px;flex-wrap:wrap}.hint{font-size:12px;color:var(--muted);line-height:1.6}.history-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border)}.history-row:first-child{border-top:0}.history-title{font-size:13px;font-weight:650}.history-meta{font-size:12px;color:var(--sub);margin-top:5px}.history-action{display:flex;align-items:center;gap:8px}
.nav{position:fixed;z-index:15;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:940px;border-top:1px solid var(--border);background:rgba(255,255,255,.97);backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px #27324d0a}.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:0;background:transparent;color:#8690a2;font-size:11px;font-weight:650;min-height:53px;border-radius:10px}.nav button.active{color:var(--accent);background:var(--accent-soft)}.nav .ico{font-size:19px;line-height:1}
dialog{border:0;padding:0;background:#fff;border-radius:18px;width:min(530px,calc(100vw - 22px));max-height:calc(100dvh - 28px);overflow:hidden;box-shadow:0 25px 75px #1c253445}dialog::backdrop{background:#161c2d90;backdrop-filter:blur(2px)}.dialog-body{max-height:calc(100dvh - 28px);overflow:auto;padding:23px}.dialog-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:20px}.dialog-head h3{margin:0;font-size:19px;letter-spacing:-.025em}.dialog-head p{font-size:12px;color:var(--sub);line-height:1.6;margin:6px 0 0}.close{border:0;border-radius:9px;background:#f2f3f6;color:#526073;min-height:34px;min-width:34px;font-size:20px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;min-width:0}.field label,.field .lab{font-size:12px;color:#455064;font-weight:700}.field input,.field select,.field textarea{border:1px solid #dfe4eb;border-radius:10px;background:#fff;color:var(--ink);font-size:15px;min-height:44px;padding:10px 11px;width:100%}.field textarea{min-height:73px;resize:vertical}.field-note{font-size:11px;color:var(--muted);line-height:1.6}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:175px;overflow:auto}.checks label{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:9px;padding:9px;font-size:13px}.checks input,.check-line input{width:17px;height:17px;accent-color:var(--accent)}.check-line{display:flex;align-items:center;gap:7px;font-size:13px;color:#455064}.dialog-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.dialog-footer .btn{flex:1}.pay-preview{display:flex;justify-content:space-between;align-items:center;background:#f2f5fa;padding:13px 14px;border-radius:11px;margin-top:5px}.pay-preview span{font-size:13px;color:var(--sub)}.pay-preview strong{font-size:20px;font-variant-numeric:tabular-nums}
#toast{display:none;position:fixed;z-index:60;left:50%;bottom:101px;transform:translateX(-50%);max-width:calc(100vw - 36px);background:#263957;color:white;box-shadow:0 10px 25px #0003;border-radius:12px;padding:11px 15px;text-align:center;font-size:13px;white-space:normal}
@media(max-width:720px){.app{padding:20px 14px 116px}.top{align-items:flex-start;flex-wrap:wrap;margin-bottom:24px}.page-head{align-items:flex-start}.page-head h2{font-size:23px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:15px}.stat strong{font-size:23px}.grid{grid-template-columns:1fr}.panel{padding:15px}.settings-block{flex-direction:column;align-items:flex-start}.form-row{gap:10px}}
@media(max-width:390px){.student-item{padding:12px}.student-top{align-items:flex-start}.quick{min-width:65px}.month-picker input{width:130px}.checks{grid-template-columns:1fr}.stat strong{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true">课</div><div><h1>课时账本</h1><span>学员考勤 · 课酬统计</span></div></div>
    <label class="month-picker">统计月份 <input type="month" id="monthInput" aria-label="统计月份"></label>
  </header>
  <main id="main" aria-live="polite"></main>
</div>
<nav class="nav" aria-label="主导航">
  <button data-tab="home" class="active" type="button"><span class="ico">▦</span>首页</button>
  <button data-tab="students" type="button"><span class="ico">☑</span>学员</button>
  <button data-tab="sessions" type="button"><span class="ico">▤</span>课程</button>
  <button data-tab="settings" type="button"><span class="ico">⚙</span>数据</button>
</nav>
<dialog id="studentDialog" aria-labelledby="studentDialogTitle"><div class="dialog-body">
  <div class="dialog-head"><div><h3 id="studentDialogTitle">添加学员</h3><p>按节数记录。报了 30 节课，就填 30。</p></div><button type="button" class="close" data-close="studentDialog" aria-label="关闭">×</button></div>
  <form id="studentForm"><input type="hidden" id="studentId">
    <div class="field"><label for="studentName">学员姓名 *</label><input id="studentName" maxlength="60" placeholder="输入姓名" required></div>
    <div class="field"><label for="purchasedLessons">报名节数（节）</label><input type="number" min="0" max="100000" step="1" id="purchasedLessons" value="0" required><div class="field-note">例如报了 30 节填 30。填 0 表示不设置课包总数。</div></div>
    <div class="field"><label for="studentNotes">备注（选填）</label><textarea id="studentNotes" maxlength="500" placeholder="例如：周六下午"></textarea></div>
    <div id="legacyHoursNote" class="section-notice" hidden></div>
    <div class="dialog-footer"><button type="button" class="btn" data-close="studentDialog">取消</button><button type="submit" class="btn primary">保存</button></div>
  </form>
</div></dialog>
<dialog id="sessionDialog" aria-labelledby="sessionDialogTitle"><div class="dialog-body">
  <div class="dialog-head"><div><h3 id="sessionDialogTitle">记课程</h3><p>课程记录用于计算老师课酬；勾选到课学员时也会计入考勤。</p></div><button type="button" class="close" data-close="sessionDialog" aria-label="关闭">×</button></div>
  <form id="sessionForm"><input id="sessionId" type="hidden">
    <div class="form-row"><div class="field"><label for="sessionDate">上课日期 *</label><input type="date" id="sessionDate" required></div><div class="field"><label for="duration">授课时长（小时）*</label><input type="number" id="duration" min="0.25" max="24" step="0.25" value="1" required></div></div>
    <div class="field"><label for="sessionTitle">课程名称 *</label><input id="sessionTitle" maxlength="80" placeholder="例如：周六基础班" required></div>
    <div class="form-row"><div class="field"><label for="payMode">计薪方式</label><select id="payMode"><option value="hourly">按小时</option><option value="perSession">按节课</option></select></div><div class="field"><label for="rate">课酬单价（元）*</label><input id="rate" type="number" min="0" max="999999" step="0.01" value="100" required></div></div>
    <div class="field"><span class="lab">本次到课学员（选填）</span><div id="sessionStudents" class="checks"></div><div class="field-note">提前给学员点过 +1 的同日考勤，会与这条课程记录合并，不会重复加课。</div></div>
    <div class="field"><label for="sessionNotes">备注（选填）</label><textarea id="sessionNotes" maxlength="500" placeholder=""></textarea></div>
    <label class="check-line"><input type="checkbox" id="sessionSettled"> 已结算</label>
    <div class="pay-preview"><span>本节课酬</span><strong id="payPreview">¥100.00</strong></div>
    <div class="dialog-footer"><button type="button" class="btn" data-close="sessionDialog">取消</button><button type="submit" class="btn primary">保存课程</button></div>
  </form>
</div></dialog>
<dialog id="historyDialog" aria-labelledby="historyTitle"><div class="dialog-body">
  <div class="dialog-head"><div><h3 id="historyTitle">考勤明细</h3><p id="historySummary"></p></div><button type="button" class="close" data-close="historyDialog" aria-label="关闭">×</button></div>
  <div class="section-notice">补记过去的课程：选择日期后点「+1 节」。</div>
  <div class="form-row" style="align-items:end"><div class="field" style="margin-bottom:0"><label for="manualDate">补记日期</label><input id="manualDate" type="date"></div><div class="field" style="margin-bottom:0"><button class="btn primary" type="button" id="manualAdd">+1 节</button></div></div>
  <div id="historyRows" style="margin-top:19px;max-height:43vh;overflow:auto"></div>
  <div class="dialog-footer"><button class="btn" type="button" data-close="historyDialog">关闭</button></div>
</div></dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const KEY='teacher-ledger-v3-local',PREVIOUS=['teacher-ledger-v2-local','teacher-ledger-v1-local'],VERSION=3;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newid=()=>(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now()+Math.random().toString(36).slice(2,10);
const dateStr=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const today=()=>dateStr(new Date()),thisMonth=()=>today().slice(0,7);
const euro=n=>Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const hrs=n=>Number(Number(n||0).toFixed(2)).toString();
const money=n=>'¥'+euro(n);
const fee=s=>Math.round((s.payMode==='hourly'?s.duration*s.rate:s.rate)*100)/100;
const validDate=v=>{if(!/^\d{4}-(0[1-9]|1[0-2])-([0-2]\d|3[01])$/.test(v))return false;const d=new Date(v+'T12:00:00');return !isNaN(d.getTime())&&dateStr(d)===v;};
const empty=()=>({version:3,students:[],sessions:[],checkins:[],prefs:{}});
let storageUsable=true;
function validate(src){
  if(!src||typeof src!=='object'||!Array.isArray(src.students)||!Array.isArray(src.sessions))throw Error('备份中缺少学员或课程记录');
  if(Number(src.version||1)>VERSION)throw Error('这是新版本备份，请升级课时账本后恢复');
  if(src.students.length>100000||src.sessions.length>300000||((src.checkins||[]).length>600000))throw Error('记录数超出限制');
  const studentIds=new Set(),sessionIds=new Set(),checkinIds=new Set();
  const students=src.students.map(x=>{
    if(!x||typeof x.id!=='string'||!x.id||x.id.length>128||studentIds.has(x.id)||typeof x.name!=='string'||!x.name.trim())throw Error('学员数据有误或 ID 重复');
    studentIds.add(x.id);
    const purchasedLessons=Number(x.purchasedLessons??0),purchasedHours=Number(x.purchasedHours??0);
    if(!Number.isInteger(purchasedLessons)||purchasedLessons<0||purchasedLessons>100000||!Number.isFinite(purchasedHours)||purchasedHours<0||purchasedHours>100000)throw Error('报名节数或旧版课时不合法');
    return {id:x.id,name:x.name.slice(0,60),purchasedLessons,purchasedHours,notes:String(x.notes||'').slice(0,500),createdAt:String(x.createdAt||'')};
  });
  const sessions=src.sessions.map(x=>{
    if(!x||typeof x.id!=='string'||!x.id||x.id.length>128||sessionIds.has(x.id)||!validDate(x.date)||typeof x.title!=='string'||!x.title.trim())throw Error('课程记录有误或 ID 重复');
    sessionIds.add(x.id);
    const duration=Number(x.duration),rate=Number(x.rate);
    if(!Number.isFinite(duration)||duration<.25||duration>24||!Number.isFinite(rate)||rate<0||rate>999999||!['hourly','perSession'].includes(x.payMode)||!Array.isArray(x.studentIds)||x.studentIds.some(sid=>!studentIds.has(sid)))throw Error('课程时长、单价或到课学员有误');
    return {id:x.id,date:x.date,title:x.title.slice(0,80),duration,rate,payMode:x.payMode,studentIds:[...new Set(x.studentIds)],settled:!!x.settled,settledAt:x.settled?String(x.settledAt||''):'',notes:String(x.notes||'').slice(0,500),createdAt:String(x.createdAt||'')};
  });
  if(src.checkins!=null&&!Array.isArray(src.checkins))throw Error('打卡记录格式不正确');
  const checkins=(src.checkins||[]).map(x=>{
    if(!x||typeof x.id!=='string'||!x.id||x.id.length>128||checkinIds.has(x.id)||!studentIds.has(x.studentId)||!validDate(x.date))throw Error('打卡记录无效');
    checkinIds.add(x.id);
    const session=sessions.find(s=>s.id===x.linkedSessionId);
    const linkedSessionId=session&&session.studentIds.includes(x.studentId)&&session.date===x.date?x.linkedSessionId:'';
    return {id:x.id,studentId:x.studentId,date:x.date,createdAt:String(x.createdAt||''),linkedSessionId};
  });
  const prefs=src.prefs&&typeof src.prefs==='object'?{lastTitle:String(src.prefs.lastTitle||'').slice(0,80),lastRate:Number.isFinite(Number(src.prefs.lastRate))?Number(src.prefs.lastRate):100,lastMode:src.prefs.lastMode==='perSession'?'perSession':'hourly'}:{};
  return {version:VERSION,students,sessions,checkins,prefs};
}
function load(){
  for(const key of [KEY,...PREVIOUS]){
    try{const raw=localStorage.getItem(key);if(raw)return validate(JSON.parse(raw));}
    catch(err){console.warn('读取记录失败',key,err);if(key===KEY){storageUsable=false;break;}}
  }
  return empty();
}
let data=load(),tab='home',selectedMonth=thisMonth(),currentHistoryId=null,toastTimeout;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageUsable=true;return true;}catch(e){storageUsable=false;alert('保存失败。请检查浏览器存储权限，并及时导出 JSON 备份。');return false;}}
if(storageUsable)save(); // 将旧版数据复制到 V3 的存储位置；不删除旧版数据
function toast(message){const el=$('toast');el.textContent=message;el.style.display='block';clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.style.display='none',2500);}
function monthName(){return selectedMonth.slice(0,4)+'年'+Number(selectedMonth.slice(5))+'月';}
function monthSessions(){return data.sessions.filter(s=>s.date.startsWith(selectedMonth)).sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt).localeCompare(String(a.createdAt)));}
function stats(sessions){return {count:sessions.length,hours:sessions.reduce((n,s)=>n+s.duration,0),total:sessions.reduce((n,s)=>n+fee(s),0),settled:sessions.filter(s=>s.settled).reduce((n,s)=>n+fee(s),0),pending:sessions.filter(s=>!s.settled).reduce((n,s)=>n+fee(s),0)};}
// 课程关联学员每节计 1 次；直接打卡每次计 1 次。已关联课程的打卡不重复计。
function studentAttendance(sid){
  const course=data.sessions.filter(s=>s.studentIds.includes(sid)).map(s=>({id:s.id,date:s.date,title:s.title,source:'course'}));
  const manual=data.checkins.filter(c=>c.studentId===sid&&!c.linkedSessionId).map(c=>({id:c.id,date:c.date,title:'手动打卡',source:'manual'}));
  return course.concat(manual).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
}
function lessonCount(sid,month){return studentAttendance(sid).filter(x=>!month||x.date.startsWith(month)).length;}
function usedHours(sid){return data.sessions.filter(s=>s.studentIds.includes(sid)).reduce((n,s)=>n+s.duration,0);}
function studentById(id){return data.students.find(s=>s.id===id);}
function sessionById(id){return data.sessions.find(s=>s.id===id);}
function header(title,desc='',btn=''){return `<div class="page-head"><div><h2>${esc(title)}</h2>${desc?`<p>${esc(desc)}</p>`:''}</div>${btn}</div>`;}
function stat(k,v,d='',emph=false){return `<div class="stat ${emph?'emph':''}"><div class="k">${esc(k)}</div><strong>${esc(v)}</strong><div class="d">${esc(d)}</div></div>`;}
function emptyState(t,desc,action=''){return `<div class="empty"><strong>${esc(t)}</strong><div>${esc(desc)}</div>${action}</div>`;}
function getStudentCard(s,full=false){
  const count=lessonCount(s.id),monthCount=lessonCount(s.id,selectedMonth),hasPlan=s.purchasedLessons>0,left=s.purchasedLessons-count;
  const done=hasPlan?`${count} / ${s.purchasedLessons} 节`:`已上 ${count} 节`;
  const rest=hasPlan?(left>=0?`剩余 ${left} 节`:`超出 ${Math.abs(left)} 节`):'未设置报名节数';
  const percent=hasPlan?Math.max(0,Math.min(100,count/s.purchasedLessons*100)):0;
  const latestManual=data.checkins.find(c=>c.studentId===s.id&&!c.linkedSessionId);
  return `<article class="student-item" data-student-name="${esc(s.name.toLowerCase())}"><div class="student-top"><div class="student-main"><div class="student-name">${esc(s.name)} ${hasPlan&&left<=3?`<span class="pill low">${left<=0?'课时用完':'剩余不多'}</span>`:''}</div><div class="student-status"><b>${esc(done)}</b> · ${esc(rest)}</div><div class="student-count">本月 ${monthCount} 节${s.notes?` · ${esc(s.notes)}`:''}</div></div><div class="student-actions"><button class="quick" type="button" data-action="quick-add" data-id="${esc(s.id)}" aria-label="给 ${esc(s.name)} 增加一节课">+1 节</button></div></div>${hasPlan?`<div class="progress" role="progressbar" aria-label="${esc(s.name)} 上课进度" aria-valuemin="0" aria-valuemax="${s.purchasedLessons}" aria-valuenow="${Math.min(count,s.purchasedLessons)}"><div style="width:${percent}%"></div></div>`:''}${full?`<div class="student-foot"><span>累计 ${count} 节${s.purchasedHours?` · 旧版购入 ${hrs(s.purchasedHours)} 小时`:''}</span><div class="tiny-actions"><button class="btn small" type="button" data-action="history" data-id="${esc(s.id)}">明细</button><button class="btn small" type="button" data-action="edit-student" data-id="${esc(s.id)}">编辑</button>${latestManual?`<button class="btn small" type="button" data-action="undo-last" data-id="${esc(s.id)}">撤销打卡</button>`:''}<button class="btn small danger" type="button" data-action="delete-student" data-id="${esc(s.id)}">删除</button></div></div>`:''}</article>`;
}
function getCourseRow(s,detail=false){
  const names=s.studentIds.map(sid=>studentById(sid)?.name).filter(Boolean);
  return `<article class="course-item"><div class="course-main"><div class="course-name">${esc(s.title)}</div><div class="course-meta">${esc(s.date)} · ${hrs(s.duration)} 小时 · ${s.payMode==='hourly'?'按小时':'按节课'} ${money(s.rate)}${names.length?`<div>到课：${esc(names.join('、'))}</div>`:''}${s.notes?`<div>备注：${esc(s.notes)}</div>`:''}</div>${detail?`<div class="course-actions"><button type="button" class="btn small" data-action="edit-session" data-id="${esc(s.id)}">编辑</button><button type="button" class="btn small" data-action="toggle-settled" data-id="${esc(s.id)}">${s.settled?'改未结算':'标记结算'}</button><button type="button" class="btn small danger" data-action="delete-session" data-id="${esc(s.id)}">删除</button></div>`:''}</div><div class="course-side"><div class="course-money">${money(fee(s))}</div><span class="pill ${s.settled?'done':'pending'}">${s.settled?'已结算':'未结算'}</span></div></article>`;
}

  const total=data.students.length,monthTotal=data.students.reduce((n,s)=>n+lessonCount(s.id,selectedMonth),0);
  return `${header('学员考勤',`共 ${total} 名学员 · 本月打卡 ${monthTotal} 节`,'<button class="btn primary" data-action="add-student">+ 添加学员</button>')}
    <div class="section-notice">点 +1 记今天的课；「明细」可补记或删除。录入课程时选中的到课学员，也计入已上节数。</div>

}

}

function render(){
  $('monthInput').value=selectedMonth;
  document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===tab;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false');});
  $('main').innerHTML=({home:renderHome,students:renderStudents,sessions:renderSessions,settings:renderSettings})[tab]();
}
function openDialog(id){$(id).showModal();}
function closeDialog(id){$(id).close();}
function openStudent(id=''){
  const s=studentById(id);
  $('studentDialogTitle').textContent=s?'编辑学员':'添加学员';
  $('studentId').value=s?.id||'';$('studentName').value=s?.name||'';$('purchasedLessons').value=s?.purchasedLessons??0;$('studentNotes').value=s?.notes||'';
  $('legacyHoursNote').hidden=!(s?.purchasedHours);
  if(s?.purchasedHours)$('legacyHoursNote').textContent=`旧版报名记录：${hrs(s.purchasedHours)} 小时。本次新增「按节」统计，旧小时数未自动转换。请根据实际情况填写报名节数。`;
  openDialog('studentDialog');
}
function saveStudent(e){
  e.preventDefault(); const old=studentById($('studentId').value),name=$('studentName').value.trim(),count=Number($('purchasedLessons').value);
  if(!name||!Number.isInteger(count)||count<0||count>100000){toast('请填写有效的学员姓名和报名节数');return;}
  const entry={id:old?.id||newid(),name:name.slice(0,60),purchasedLessons:count,purchasedHours:old?.purchasedHours||0,notes:$('studentNotes').value.trim().slice(0,500),createdAt:old?.createdAt||new Date().toISOString()};
  if(old)data.students=data.students.map(s=>s.id===old.id?entry:s);else data.students.push(entry);
  save();closeDialog('studentDialog');tab='students';render();toast(old?'学员已更新':'学员已添加');
}
function addCheckin(sid,date=today()){
  const s=studentById(sid);if(!s||!validDate(date))return;
  const existingToday=data.checkins.filter(c=>c.studentId===sid&&c.date===date&&!c.linkedSessionId).length;
  if(existingToday>0&&!confirm(`${s.name} 在 ${date} 已有 ${existingToday} 次手动打卡。确定再加 1 节吗？`))return;
  data.checkins.push({id:newid(),studentId:sid,date,createdAt:new Date().toISOString(),linkedSessionId:''});
  save();render();if($('historyDialog').open&&currentHistoryId===sid)renderHistory(sid);
  const count=lessonCount(sid);toast(`${s.name}：已上 ${count}${s.purchasedLessons?` / ${s.purchasedLessons}`:''} 节`);
}
function undoLast(sid){
  const s=studentById(sid);
  const matches=data.checkins.filter(c=>c.studentId===sid&&!c.linkedSessionId).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  if(!s||!matches.length)return;
  const target=matches[0];
  if(!confirm(`撤销 ${s.name} ${target.date} 的 1 节手动打卡？`))return;
  data.checkins=data.checkins.filter(x=>x.id!==target.id);save();render();toast('已撤销最近一次打卡');
}
function renderHistory(sid){
  const s=studentById(sid);if(!s)return;
  $('historyTitle').textContent=s.name+' · 考勤明细';
  $('historySummary').textContent=`已上 ${lessonCount(sid)}${s.purchasedLessons?' / '+s.purchasedLessons:''} 节 · 本月 ${lessonCount(sid,selectedMonth)} 节`;
  const entries=studentAttendance(sid);
  $('historyRows').innerHTML=entries.length?entries.map(a=>`<div class="history-row"><div><div class="history-title">${esc(a.title)}</div><div class="history-meta">${esc(a.date)} · ${a.source==='manual'?'快捷打卡':'课程记录'}</div></div><div class="history-action"><b style="font-size:13px">+1 节</b>${a.source==='manual'?`<button class="btn small danger" data-action="remove-checkin" data-id="${esc(a.id)}">删除</button>`:''}</div></div>`).join(''):emptyState('没有考勤记录','可以在上面补记。');
}
function showHistory(sid){if(!studentById(sid))return;currentHistoryId=sid;$('manualDate').value=today();renderHistory(sid);openDialog('historyDialog');}
function deleteCheckin(id){
  const c=data.checkins.find(c=>c.id===id);if(!c||c.linkedSessionId)return;
  if(!confirm(`删除 ${c.date} 的这条手动打卡？`))return;
  data.checkins=data.checkins.filter(x=>x.id!==id);save();renderHistory(c.studentId);render();toast('已删除打卡');
}
function openSession(id=''){
  const s=sessionById(id);
  $('sessionDialogTitle').textContent=s?'编辑课程':'记课程';
  $('sessionId').value=s?.id||'';$('sessionDate').value=s?.date||today();$('sessionTitle').value=s?.title??data.prefs.lastTitle??'';
  $('duration').value=s?.duration??1;$('payMode').value=s?.payMode??data.prefs.lastMode??'hourly';$('rate').value=s?.rate??data.prefs.lastRate??100;
  $('sessionNotes').value=s?.notes||'';$('sessionSettled').checked=s?.settled||false;
  $('sessionStudents').innerHTML=data.students.length?data.students.map(st=>`<label><input type="checkbox" value="${esc(st.id)}" ${(s?.studentIds||[]).includes(st.id)?'checked':''}>${esc(st.name)}</label>`).join(''):'<div class="field-note">没有学员时也可以单独记录课酬。</div>';
  updatePayPreview();openDialog('sessionDialog');
}
function updatePayPreview(){const duration=Number($('duration').value)||0,rate=Number($('rate').value)||0;$('payPreview').textContent=money(Math.max(0,fee({duration,rate,payMode:$('payMode').value})));}
function matchEarlierCheckins(next,old){
  // 一节课程如在同日已有早先的 +1 打卡，就将该打卡与课程关联，防止计两次。
  if(old){
    data.checkins.forEach(c=>{
      if(c.linkedSessionId===old.id){
        if(!next.studentIds.includes(c.studentId))c.linkedSessionId='';
        else if(next.date!==old.date)c.date=next.date;
      }
    });
  }
  for(const sid of next.studentIds){
    if(data.checkins.some(c=>c.linkedSessionId===next.id&&c.studentId===sid))continue;
    const candidate=data.checkins.filter(c=>c.studentId===sid&&!c.linkedSessionId&&c.date===next.date&&(!c.createdAt||c.createdAt<=next.createdAt)).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)))[0];
    if(candidate)candidate.linkedSessionId=next.id;
  }
}
function saveSession(e){
  e.preventDefault();const old=sessionById($('sessionId').value);
  const date=$('sessionDate').value,title=$('sessionTitle').value.trim(),duration=Number($('duration').value),rate=Number($('rate').value),payMode=$('payMode').value;
  if(!validDate(date)||!title||!Number.isFinite(duration)||duration<.25||duration>24||!Number.isFinite(rate)||rate<0||rate>999999||!['hourly','perSession'].includes(payMode)){toast('请检查课程名称、时长及课酬单价');return;}
  const now=new Date().toISOString(),studentIds=[...$('sessionStudents').querySelectorAll('input:checked')].map(el=>el.value),settled=$('sessionSettled').checked;
  const next={id:old?.id||newid(),date,title:title.slice(0,80),duration,rate,payMode,studentIds,notes:$('sessionNotes').value.trim().slice(0,500),settled,settledAt:settled?(old?.settledAt||now):'',createdAt:old?.createdAt||now};
  matchEarlierCheckins(next,old);
  if(old)data.sessions=data.sessions.map(s=>s.id===old.id?next:s);else data.sessions.push(next);
  data.prefs={lastTitle:next.title,lastRate:next.rate,lastMode:next.payMode};save();closeDialog('sessionDialog');tab='sessions';selectedMonth=date.slice(0,7);render();toast(old?'课程已更新':'已记课程');
}
function deleteSession(id){const s=sessionById(id);if(!s)return;if(!confirm(`删除「${s.title}」？课程课酬会扣除；之前通过 +1 打过卡的记录仍保留。`))return;
  data.checkins.forEach(c=>{if(c.linkedSessionId===id)c.linkedSessionId='';});data.sessions=data.sessions.filter(x=>x.id!==id);save();render();toast('课程已删除');}
function deleteStudent(sid){const s=studentById(sid);if(!s)return;if(!confirm(`确定删除学员「${s.name}」及其考勤记录？课程记录和老师课酬保留。`))return;
  data.checkins=data.checkins.filter(c=>c.studentId!==sid);data.sessions.forEach(c=>{c.studentIds=c.studentIds.filter(x=>x!==sid);});data.students=data.students.filter(x=>x.id!==sid);save();render();toast('学员已删除');}
function csvCell(x){return '"'+String(x??'').replaceAll('"','""')+'"';}
function csv(rows){return '\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';}
function download(content,name,mime){const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('已开始下载 '+name);}
function exportStudents(){const rows=[['学员','报名节数','累计已上节数','剩余节数','统计月份','本月已上节数','旧版购入小时','备注']];data.students.forEach(s=>rows.push([s.name,s.purchasedLessons||'未设置',lessonCount(s.id),s.purchasedLessons?s.purchasedLessons-lessonCount(s.id):'未设置',selectedMonth,lessonCount(s.id,selectedMonth),s.purchasedHours||'',s.notes]));download(csv(rows),'课时账本_学员_'+selectedMonth+'.csv','text/csv;charset=utf-8');}
function exportAttendance(){const rows=[['日期','学员','课程/来源','计入节数','记录类型']];data.students.forEach(s=>studentAttendance(s.id).forEach(a=>rows.push([a.date,s.name,a.title,1,a.source==='manual'?'快捷打卡':'课程关联'])));download(csv(rows),'课时账本_考勤全部.csv','text/csv;charset=utf-8');}
function exportSessions(){const rows=[['日期','课程','时长(小时)','计薪方式','单价(元)','本节课酬(元)','到课学员','结算状态','备注']];monthSessions().forEach(s=>rows.push([s.date,s.title,hrs(s.duration),s.payMode==='hourly'?'按小时':'按节课',euro(s.rate),euro(fee(s)),s.studentIds.map(x=>studentById(x)?.name||'').join('、'),s.settled?'已结算':'未结算',s.notes]));download(csv(rows),'课时账本_课程_'+selectedMonth+'.csv','text/csv;charset=utf-8');}
function backup(){download(JSON.stringify({app:'TeacherLedger',version:VERSION,exportedAt:new Date().toISOString(),data},null,2),'课时账本_备份_'+today()+'.json','application/json;charset=utf-8');}
$('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>20*1024*1024)throw Error('备份文件超过 20 MB');const raw=JSON.parse(await f.text()),next=validate(raw.data||raw);if(!confirm(`恢复备份将覆盖当前记录。\n备份包含 ${next.students.length} 名学员、${next.sessions.length} 节课程、${next.checkins.length} 条快捷打卡。\n确定恢复吗？`))return;data=next;save();tab='home';render();toast('备份恢复成功');}catch(err){alert('恢复失败：'+err.message);}finally{e.target.value='';}});
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;render();window.scrollTo(0,0);return;}
  const close=e.target.closest('[data-close]');if(close){closeDialog(close.dataset.close);return;}
  const btn=e.target.closest('[data-action]');if(!btn)return;
  const a=btn.dataset.action,uid=btn.dataset.id;
  if(a==='go-students'){tab='students';render();}else if(a==='go-sessions'){tab='sessions';render();}
  else if(a==='add-student')openStudent();else if(a==='edit-student')openStudent(uid);
  else if(a==='quick-add')addCheckin(uid);else if(a==='undo-last')undoLast(uid);else if(a==='history')showHistory(uid);
  else if(a==='remove-checkin')deleteCheckin(uid);else if(a==='delete-student')deleteStudent(uid);
  else if(a==='add-session')openSession();else if(a==='edit-session')openSession(uid);
  else if(a==='toggle-settled'){const s=sessionById(uid);if(!s)return;s.settled=!s.settled;s.settledAt=s.settled?new Date().toISOString():'';save();render();toast(s.settled?'已结算':'已改为未结算');}
  else if(a==='delete-session')deleteSession(uid);
  else if(a==='backup')backup();else if(a==='export-students')exportStudents();else if(a==='export-attendance')exportAttendance();else if(a==='export-sessions')exportSessions();else if(a==='restore'){$('importFile').value='';$('importFile').click();}
  else if(a==='clear'){if(confirm('清空所有学员、考勤、课程和结算记录？请先备份。')&&confirm('此操作无法撤销，确定清空吗？')){data=empty();save();render();toast('全部记录已清空');}}
});
$('studentForm').addEventListener('submit',saveStudent);$('sessionForm').addEventListener('submit',saveSession);
$('manualAdd').addEventListener('click',()=>{if(currentHistoryId)addCheckin(currentHistoryId,$('manualDate').value);});
$('monthInput').addEventListener('change',e=>{if(/^\d{4}-(0[1-9]|1[0-2])$/.test(e.target.value)){selectedMonth=e.target.value;render();}});
document.addEventListener('input',e=>{if(e.target.id==='studentSearch'){const q=e.target.value.toLowerCase().trim();document.querySelectorAll('#studentResults [data-student-name]').forEach(el=>el.style.display=el.dataset.studentName.includes(q)?'':'none');}});
for(const i of ['duration','rate','payMode'])$(i).addEventListener('input',updatePayPreview);
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close();}));
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
